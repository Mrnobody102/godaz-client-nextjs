name: Frontend CI/CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  repository_dispatch: # Trigger từ BE
    types: [backend-deployed]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm test --if-present
      - name: Lint
        run: npm run lint

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy to S3
        run: |
          aws s3 sync .next/static/ s3://your-frontend-bucket/ --delete
          aws s3 sync out/ s3://your-frontend-bucket/ --delete  # Nếu static export
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id YOUR_CLOUDFRONT_ID \
            --paths "/*"
